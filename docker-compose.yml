services:
  db:
    image: postgres:15
    container_name: bank_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: bankdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: bank_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres123@db:5432/bankdb
    ports:
      - "8000:8000"

volumes:
  postgres_data: